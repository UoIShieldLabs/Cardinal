services:
  mongodb:
    build:
      context: mongo
    image: ${REPO}/rs-mongodb:${TAG}
    networks:
      - robot-shop
    logging: &logging
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"
  redis:
    image: redis:6.2-alpine
    networks:
      - robot-shop
    logging:
      <<: *logging
  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    networks:
      - robot-shop
    logging:
      <<: *logging
  catalogue:
    build:
      context: catalogue
    image: ${REPO}/rs-catalogue:${TAG}
    depends_on:
      - mongodb
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      <<: *logging
  user:
    build:
      context: user
    image: ${REPO}/rs-user:${TAG}
    depends_on:
      - mongodb
      - redis
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      <<: *logging
  cart:
    build:
      context: cart
    image: ${REPO}/rs-cart:${TAG}
    depends_on:
      - redis
    networks:
      - robot-shop
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      <<: *logging
  mysql:
    build:
      context: mysql
    image: ${REPO}/rs-mysql-db:${TAG}
    cap_add:
      - NET_ADMIN
    networks:
      - robot-shop
    logging:
      <<: *logging
  shipping:
    build:
      context: shipping
    image: ${REPO}/rs-shipping:${TAG}
    depends_on:
      - mysql
    networks:
      - robot-shop
    healthcheck:
      test: ["CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      <<: *logging
  ratings:
    build:
      context: ratings
    image: ${REPO}/rs-ratings:${TAG}
    environment:
      APP_ENV: prod
    networks:
      - robot-shop
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost/_health"]
      interval: 10s
      timeout: 10s
      retries: 3
    logging:
      <<: *logging
  payment:
    build:
      context: payment
    image: ${REPO}/rs-payment:${TAG}
    depends_on:
      - rabbitmq
    networks:
      - robot-shop
    healthcheck:
      test: ["CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    # Uncomment to change payment gateway
    #environment:
      #PAYMENT_GATEWAY: "https://www.worldpay.com"
    logging:
      <<: *logging
  dispatch:
    build:
      context: dispatch
    image: ${REPO}/rs-dispatch:${TAG}
    depends_on:
      - rabbitmq
    networks:
      - robot-shop
    logging:
      <<: *logging
  web:
    build:
      context: web
      args:
        KEY: ${INSTANA_AGENT_KEY}
    image: ${REPO}/rs-web:${TAG}
    depends_on:
      - catalogue
      - user
      - shipping
      - payment
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:8080"
    environment:
      CATALOGUE_HOST: catalogue
      USER_HOST: user
      CART_HOST: cart
      SHIPPING_HOST: shipping
      PAYMENT_HOST: payment
      RATINGS_HOST: ratings
    networks:
      robot-shop:
      protected_net:
        ipv4_address: 10.0.3.10
    healthcheck:
      test: [ "CMD", "curl", "-H", "X-INSTANA-SYNTHETIC: 1", "-f", "http://localhost:8080/" ]
      interval: 10s
      timeout: 10s
      retries: 3
    command: >
      sh -c "which ip || (echo 'deb [trusted=yes] http://archive.debian.org/debian buster main contrib non-free' > /etc/apt/sources.list &&
             echo 'deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main contrib non-free' >> /etc/apt/sources.list &&
             apt-get update && apt-get install -y iproute2) &&
             ip route add 10.0.1.0/24 via 10.0.3.100 || true &&
             export CATALOGUE_HOST=catalogue USER_HOST=user CART_HOST=cart SHIPPING_HOST=shipping PAYMENT_HOST=payment RATINGS_HOST=ratings &&
             envsubst '\$$CATALOGUE_HOST \$$USER_HOST \$$CART_HOST \$$SHIPPING_HOST \$$PAYMENT_HOST \$$RATINGS_HOST' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf &&
             sed -i '/opentracing/d' /etc/nginx/conf.d/default.conf &&
             /usr/sbin/nginx -g 'daemon off;'"
    logging:
      <<: *logging
  monitor:
    build:
      context: ./monitor
    container_name: monitor
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      robot-shop:
      protected_net:
    volumes:
      - ./dataset:/dataset
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  robot-shop:
    driver: bridge
  protected_net:
    external: true
    name: cardinal-lab_protected_net #had to use the name that was listed in docker network ls
