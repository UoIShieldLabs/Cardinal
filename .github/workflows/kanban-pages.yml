name: Kanban board

on:
  push:
    branches: [main]
    paths:
      - 'kanban/**'
      - '.github/workflows/kanban-pages.yml'
  pull_request:
    paths:
      - 'kanban/**'
      - '.github/workflows/kanban-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanban-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test the board
        run: python -m unittest discover -s kanban -p 'test_*.py' -v
      - name: Build the read-only board
        run: python kanban/board.py build --output kanban/dist
      - name: Upload the board
        uses: actions/upload-pages-artifact@v4
        with:
          path: kanban/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the board
        id: deployment
        uses: actions/deploy-pages@v4
