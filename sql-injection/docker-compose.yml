services:
  attacker:
    build: ./attacker
    container_name: attacker
    networks:
      external_net:
        ipv4_address: 10.0.0.10
    command: tail -f /dev/null

  benign-users:
    build: ./benign-users
    container_name: benign_users
    networks:
      external_net:
        ipv4_address: 10.0.0.11
    command: tail -f /dev/null

  perimeter-fw:
    build: ./perimeter-fw
    container_name: perimeter_fw
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      external_net:
        ipv4_address: 10.0.0.254
      edge_net:
        ipv4_address: 172.30.0.254
    command: tail -f /dev/null

  proxy-waf:
    build: ./proxy-waf
    container_name: proxy_waf
    networks:
      edge_net:
        ipv4_address: 172.30.0.10

  core-router:
    build: ./core-router
    container_name: core_router
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      edge_net:
        ipv4_address: 172.30.0.253
      app_net:
        ipv4_address: 172.31.0.254
      data_net:
        ipv4_address: 172.32.0.254
    command: tail -f /dev/null

  webapp:
    build: ./webapp
    container_name: webapp
    networks:
      app_net:
        ipv4_address: 172.31.0.10

  deser-svc:
    build: ./deser-svc
    container_name: deser_svc
    networks:
      app_net:
        ipv4_address: 172.31.0.11
    command: tail -f /dev/null

  db:
    build: ./db
    container_name: db
    environment:
      POSTGRES_PASSWORD: shoppassword
    networks:
      data_net:
        ipv4_address: 172.32.0.10

  cache:
    build: ./cache
    container_name: cache
    networks:
      data_net:
        ipv4_address: 172.32.0.11

  monitor:
    build: ./monitor
    container_name: monitor
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      edge_net:
        ipv4_address: 172.30.0.100
      app_net:
        ipv4_address: 172.31.0.100
      data_net:
        ipv4_address: 172.32.0.100
    command: tail -f /dev/null

networks:
  external_net:
    ipam:
      config:
        - subnet: 10.0.0.0/24
  edge_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  app_net:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  data_net:
    ipam:
      config:
        - subnet: 172.32.0.0/24