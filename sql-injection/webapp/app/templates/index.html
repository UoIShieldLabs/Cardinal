{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <div class="card">
    <h1>Welcome to the Staff Portal</h1>
    <p>Search the shared staff <a href="{{ url_for('search') }}">directory</a>,
       or <a href="{{ url_for('login') }}">log in</a> to view your profile.</p>
    {% if user %}
      <p class="muted">Signed in as {{ user.display_name or user.username }}.</p>
    {% endif %}
  </div>
{% endblock %}
