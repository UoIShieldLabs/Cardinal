{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <div class="card" style="max-width: 380px;">
    <h1>Log in</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <p><label>Username<br><input type="text" name="username" autofocus></label></p>
      <p><label>Password<br><input type="password" name="password"></label></p>
      <p><button type="submit">Sign in</button></p>
    </form>
    <p class="muted">Directory users: alice / bob / carol.</p>
  </div>
  {% if executed_sql %}
    <p class="muted" style="margin-top:14px;">Query executed:</p>
    <div class="sql">{{ executed_sql }}</div>
  {% endif %}
{% endblock %}
