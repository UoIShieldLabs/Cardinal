<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Staff Portal{% endblock %} · Cardinal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1b1f24; }
    header { background: #1c3d5a; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: baseline; }
    header a { color: #cfe2f3; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    header .brand { font-weight: 700; color: #fff; }
    header .spacer { flex: 1; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6ea; }
    th { background: #eef1f4; }
    input[type=text], input[type=password] { padding: 6px 8px; border: 1px solid #c3c9d0; border-radius: 4px; }
    button { padding: 6px 14px; border: 0; border-radius: 4px; background: #1c3d5a; color: #fff; cursor: pointer; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 6px; padding: 16px 18px; }
    .error { color: #b00020; }
    .sql { font-family: ui-monospace, monospace; font-size: 12px; color: #555; background: #fbfbfc; border: 1px dashed #d0d4d8; padding: 8px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
    .muted { color: #667; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Cardinal Staff Portal</span>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('search') }}">Directory</a>
    <span class="spacer"></span>
    {% if user %}
      <span class="muted">{{ user.display_name or user.username }}</span>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
