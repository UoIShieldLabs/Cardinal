# Cardinal Phase 1 — plain nginx reverse proxy (the choke point).
# No WAF, no TLS: forward everything to the webapp on app-net.

events {
    worker_connections 256;
}

http {
    upstream webapp {
        server 172.31.0.20:5000;
    }

    # Keep the log format simple and cleartext for the monitor / later log
    # alignment. Access log to stdout so `kathara connect proxy` shows traffic.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
