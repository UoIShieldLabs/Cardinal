events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Custom log 
    # This custom log includes vital $upstream_cache_status variable for L2 monitoring
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache:$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Serve and cache static assets - (cheap requests)
        location /static/ {
            root /var/www/html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }
        
        location /img/ {
            root /var/www/html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Reverse proxy to the Python App Server (expensive requests)
        location / {
            # We will name the Python container 'app' in docker-compose
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}